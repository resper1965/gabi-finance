[project]
name = "gabi-finance"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "PyYAML", "PyJWT", "cryptography", "mcp", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff"]
transcricao = ["faster-whisper"]
capturas = ["playwright"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 200

[tool.ruff.lint]
select = ["F"]

[tool.ruff.lint.per-file-ignores]
# fixtures do pytest importadas de outro módulo de teste e usadas como parâmetro: o pyflakes as vê como redefinição
"tests/**" = ["F811"]
